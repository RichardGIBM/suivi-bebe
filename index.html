<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Suivi Bébé</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Suivi Bébé" />

  <link rel="stylesheet" href="styles.css?v=26" />
</head>
<body>
  <!-- Indicateur "tirer pour rafraîchir" -->
  <div id="ptr" class="ptr" aria-hidden="true"><div class="ptr-spinner"></div></div>

  <div id="app">

    <!-- ===== Vue SUIVI ===== -->
    <div class="view" id="view-suivi">
      <header class="topbar">
        <button class="nav-btn" id="prevDay" aria-label="Jour précédent">‹</button>
        <div class="date-wrap">
          <div class="date-label" id="dateLabel">Aujourd'hui</div>
          <div class="date-sub" id="dateSub"></div>
        </div>
        <button class="nav-btn" id="nextDay" aria-label="Jour suivant">›</button>
      </header>

      <!-- Bandeau "dernière fois" -->
      <section class="status-strip" id="statusStrip"></section>

      <!-- Checklist quotidienne -->
      <section class="checklist-wrap">
        <h2 class="section-label">Chaque jour</h2>
        <div class="checklist" id="checklist"></div>
      </section>

      <!-- Grille de boutons d'action -->
      <main class="grid" id="actionGrid"></main>

      <!-- Ce que j'ai appris aujourd'hui -->
      <section class="learned-wrap">
        <h2 class="section-label">✨ Ce que j'ai appris aujourd'hui</h2>
        <div class="learned-input">
          <input type="text" id="learnedText" autocomplete="off" autocapitalize="sentences" />
          <button id="learnedAdd">Ajouter</button>
        </div>
        <ul class="learned-today" id="learnedToday"></ul>
      </section>

      <!-- Journal du jour -->
      <section class="timeline-wrap">
        <div class="journal-head">
          <h2 class="section-label">Journal <span id="timelineCount"></span></h2>
          <div class="seg" id="journalSeg" role="tablist" aria-label="Vue du journal">
            <button type="button" data-view="list" class="active">Liste</button>
            <button type="button" data-view="timeline">Frise</button>
          </div>
        </div>
        <ul class="timeline" id="timeline"></ul>
        <div class="tl-host" id="timelineFrise" hidden></div>
      </section>
    </div>

    <!-- ===== Vue APPRIS ===== -->
    <div class="view" id="view-appris" hidden>
      <header class="view-header">
        <h1>✨ Ce que bébé a appris</h1>
        <p class="view-sub">Chaque nouvelle chose, avec sa date</p>
      </header>
      <div id="apprisList"></div>
    </div>

    <!-- ===== Vue STATS ===== -->
    <div class="view" id="view-stats" hidden></div>

  </div>

  <!-- Pastille d'état de synchro (masquée si synchro non configurée) -->
  <button class="sync-pill" id="syncPill" hidden aria-label="État de synchronisation"></button>

  <!-- Barre d'onglets -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- Écran de déverrouillage (synchro partagée) -->
  <div class="lock-screen" id="lockScreen" hidden>
    <div class="lock-card">
      <div class="lock-emoji">🍼</div>
      <h1 class="lock-title">Suivi Bébé</h1>
      <p class="lock-sub">Entre le code partagé pour synchroniser les deux téléphones.</p>
      <!-- Champ identifiant fictif : donne une cible à l'autocomplétion du navigateur
           pour qu'il n'aille PAS proposer un identifiant dans les champs texte de l'app. -->
      <input type="text" autocomplete="username" value="foyer" hidden aria-hidden="true" tabindex="-1" />
      <input type="password" inputmode="text" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" class="lock-input" id="pinInput" placeholder="Code partagé" />
      <div class="lock-error" id="pinError"></div>
      <button class="btn btn-primary lock-btn" id="pinSubmit">Déverrouiller</button>
      <button class="lock-later" id="pinLater" hidden>Plus tard</button>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <!-- Popover d'info de la frise (lecture seule, ancré à la marque touchée) -->
  <div class="pop" id="journalPop"><div class="pop-arrow"></div><div class="pop-body"></div></div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js?v=15"></script>
  <script src="stats.js?v=27"></script>
  <script src="app.js?v=27"></script>
  <script>
    // Enregistrement du service worker (PWA hors-ligne)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
